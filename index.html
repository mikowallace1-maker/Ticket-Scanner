<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-900 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket Barcode Scanner</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- html5-qrcode Library CDN -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Custom scrollbar styling */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }
        /* HTML5 QR Code scanner styling overrides */
        #reader {
            border: none !important;
        }
        #reader video {
            object-fit: cover !important;
            border-radius: 0.75rem;
        }
        #reader__scan_region {
            background: transparent !important;
        }
        #reader__dashboard_section {
            padding: 0.5rem !important;
        }
        #reader__dashboard_section_csr button {
            background-color: #3b82f6 !important;
            color: white !important;
            padding: 0.5rem 1rem !important;
            border-radius: 0.5rem !important;
            font-weight: 600 !important;
            border: none !important;
            margin-top: 0.5rem !important;
        }
    </style>
</head>
<body class="h-full flex flex-col font-sans antialiased selection:bg-blue-500 selection:text-white">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50">
        <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600 p-2 rounded-lg">
                    <i class="fa-solid fa-barcode text-white text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">Ticket Scanner</h1>
                    <p class="text-xs text-slate-400">HAM Series (001 - 100)</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button id="soundToggleBtn" onclick="toggleSound()" class="p-2 text-slate-400 hover:text-white bg-slate-700/50 hover:bg-slate-700 rounded-lg transition" title="Toggle Sound">
                    <i id="soundIcon" class="fa-solid fa-volume-high text-lg text-blue-400"></i>
                </button>
                <button onclick="confirmReset()" class="p-2 text-slate-400 hover:text-red-400 bg-slate-700/50 hover:bg-slate-700 rounded-lg transition" title="Reset Database">
                    <i class="fa-solid fa-rotate-right text-lg"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Body Container -->
    <main class="flex-1 max-w-md w-full mx-auto p-4 flex flex-col space-y-4 overflow-y-auto">

        <!-- Stats Overview Banner -->
        <div class="grid grid-cols-3 gap-2 bg-slate-800/80 backdrop-blur p-3 rounded-xl border border-slate-700 text-center">
            <div class="bg-slate-900/60 p-2 rounded-lg">
                <div class="text-xs text-slate-400 uppercase tracking-wider">Total</div>
                <div id="statTotal" class="text-lg font-bold text-slate-200">100</div>
            </div>
            <div class="bg-slate-900/60 p-2 rounded-lg">
                <div class="text-xs text-emerald-400 uppercase tracking-wider">Valid</div>
                <div id="statValid" class="text-lg font-bold text-emerald-400">100</div>
            </div>
            <div class="bg-slate-900/60 p-2 rounded-lg">
                <div class="text-xs text-rose-400 uppercase tracking-wider">Used</div>
                <div id="statUsed" class="text-lg font-bold text-rose-400">0</div>
            </div>
        </div>

        <!-- Camera Scanner Section -->
        <div class="bg-slate-800 rounded-xl p-3 border border-slate-700 shadow-xl relative overflow-hidden flex flex-col">
            <div class="flex justify-between items-center mb-2 px-1">
                <span class="text-sm font-semibold text-slate-300 flex items-center gap-2">
                    <i class="fa-solid fa-camera text-blue-400"></i> Live Scanner
                </span>
                <span id="scanModeIndicator" class="text-xs bg-blue-500/10 text-blue-400 px-2 py-0.5 rounded-full border border-blue-500/20">Ready</span>
            </div>

            <!-- Scanner Display Container -->
            <div class="relative w-full rounded-lg overflow-hidden bg-slate-950 aspect-square flex items-center justify-center border border-slate-800">
                <div id="reader" class="w-full h-full"></div>
                <div id="scannerPlaceholder" class="absolute inset-0 flex flex-col items-center justify-center text-slate-500 p-4 text-center">
                    <i class="fa-solid fa-camera-retro text-4xl mb-2 text-slate-600"></i>
                    <p class="text-xs">Camera is currently paused or inactive</p>
                    <button onclick="startScanner()" class="mt-3 bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold px-4 py-2 rounded-lg transition shadow-lg">
                        Start Camera
                    </button>
                </div>
            </div>

            <!-- Camera Controls -->
            <div class="flex gap-2 mt-3">
                <button id="toggleCameraBtn" onclick="toggleScanner()" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold py-2.5 px-3 rounded-lg flex items-center justify-center gap-2 transition shadow-md">
                    <i class="fa-solid fa-video"></i> <span>Start Camera</span>
                </button>
            </div>
        </div>

        <!-- Manual Code Input Section -->
        <div class="bg-slate-800 rounded-xl p-4 border border-slate-700 shadow-xl">
            <label for="manualInput" class="text-xs font-semibold text-slate-300 block mb-2">
                <i class="fa-solid fa-keyboard text-blue-400 mr-1"></i> Manual Code / Search
            </label>
            <form onsubmit="handleManualSubmit(event)" class="flex gap-2">
                <input type="text" id="manualInput" placeholder="e.g. Ticket_HAM-042 or 042" class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 uppercase tracking-wide">
                <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-xs px-4 py-2 rounded-lg transition flex items-center gap-1 shadow-md">
                    <i class="fa-solid fa-check"></i> Verify
                </button>
            </form>
        </div>

        <!-- Dynamic Status Result Box -->
        <div id="statusResultBox" class="hidden rounded-xl p-4 border shadow-2xl transition-all duration-300">
            <div class="flex items-start gap-3">
                <div id="statusIconBg" class="p-3 rounded-xl flex items-center justify-center text-2xl shrink-0">
                    <i id="statusIcon" class="fa-solid"></i>
                </div>
                <div class="flex-1 min-w-0">
                    <div class="flex justify-between items-start">
                        <h3 id="statusTitle" class="font-bold text-lg leading-tight">--</h3>
                        <span id="statusTime" class="text-[10px] text-slate-400 bg-slate-900/40 px-2 py-0.5 rounded"></span>
                    </div>
                    <p id="statusTicketId" class="font-mono text-sm font-semibold mt-0.5 text-slate-200">--</p>
                    <p id="statusMessage" class="text-xs mt-1 text-slate-300 leading-normal">--</p>
                </div>
            </div>
        </div>

        <!-- Scan History & Ticket Log -->
        <div class="bg-slate-800 rounded-xl p-4 border border-slate-700 shadow-xl flex-1 flex flex-col min-h-[220px]">
            <div class="flex items-center justify-between mb-3">
                <h2 class="text-sm font-semibold text-slate-200 flex items-center gap-2">
                    <i class="fa-solid fa-clock-rotate-left text-blue-400"></i> Scan Activity Log
                </h2>
                <button onclick="clearHistoryLog()" class="text-xs text-slate-400 hover:text-slate-200 transition">
                    Clear Log
                </button>
            </div>
            
            <div id="historyList" class="flex-1 overflow-y-auto space-y-2 pr-1 max-h-[240px]">
                <!-- Dynamic Log Items Rendered Here -->
            </div>
        </div>

    </main>

    <!-- Reset Confirmation Modal -->
    <div id="resetModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-xl max-w-sm w-full p-5 shadow-2xl text-center">
            <div class="w-12 h-12 bg-rose-500/20 text-rose-400 rounded-full flex items-center justify-center mx-auto mb-3 text-xl">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h3 class="text-lg font-bold text-slate-100">Reset All Tickets?</h3>
            <p class="text-xs text-slate-400 mt-2">This will clear scan histories and mark all 100 tickets (Ticket_HAM-001 to Ticket_HAM-100) as valid and unused.</p>
            <div class="flex gap-2 mt-5">
                <button onclick="closeResetModal()" class="flex-1 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-semibold py-2.5 rounded-lg transition">
                    Cancel
                </button>
                <button onclick="executeReset()" class="flex-1 bg-rose-600 hover:bg-rose-500 text-white text-xs font-semibold py-2.5 rounded-lg transition shadow-lg">
                    Yes, Reset All
                </button>
            </div>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        const STORAGE_KEY = "ticket_db_ham_v1";
        const HISTORY_KEY = "ticket_scan_history_v1";
        
        let ticketsDB = {};
        let scanHistory = [];
        let html5QrCode = null;
        let isScannerRunning = false;
        let soundEnabled = true;
        let lastScannedCode = null;
        let lastScanTime = 0;

        // Initialize Web Audio Context for Sound Effects
        let audioCtx = null;

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        // Initialize Ticket Database (Ticket_HAM-001 to Ticket_HAM-100)
        function initDatabase() {
            const storedDB = localStorage.getItem(STORAGE_KEY);
            if (storedDB) {
                ticketsDB = JSON.parse(storedDB);
            } else {
                ticketsDB = {};
                for (let i = 1; i <= 100; i++) {
                    const id = `Ticket_HAM-${String(i).padStart(3, '0')}`;
                    ticketsDB[id] = {
                        valid: true,
                        used: false,
                        usedAt: null
                    };
                }
                saveDatabase();
            }

            const storedHistory = localStorage.getItem(HISTORY_KEY);
            if (storedHistory) {
                scanHistory = JSON.parse(storedHistory);
            }
            updateStatsUI();
            renderHistoryUI();
        }

        function saveDatabase() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(ticketsDB));
            updateStatsUI();
        }

        function saveHistory() {
            localStorage.setItem(HISTORY_KEY, JSON.stringify(scanHistory));
            renderHistoryUI();
        }

        // Audio Effects Synthesizer
        function playSound(type) {
            if (!soundEnabled) return;
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;

                if (type === 'valid') {
                    // Success High Beep
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(880, now); // A5
                    osc.frequency.exponentialRampToValueAtTime(1760, now + 0.15); // A6
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === 'invalid' || type === 'used') {
                    // Error Low Buzz
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, now); // A3
                    osc.frequency.setValueAtTime(110, now + 0.1); // A2
                    gain.gain.setValueAtTime(0.4, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.3);
                }
            } catch (e) {
                console.warn("Audio playback failed:", e);
            }
        }

        function triggerVibration(pattern) {
            if ("vibrate" in navigator) {
                navigator.vibrate(pattern);
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const icon = document.getElementById("soundIcon");
            if (soundEnabled) {
                icon.className = "fa-solid fa-volume-high text-lg text-blue-400";
            } else {
                icon.className = "fa-solid fa-volume-xmark text-lg text-slate-500";
            }
        }

        // Normalize raw string input to expected ticket ID format
        function normalizeTicketCode(input) {
            if (!input) return "";
            let cleaned = input.trim();
            // Handle numeric shortcut (e.g. "42" -> "Ticket_HAM-042")
            if (/^\d{1,3}$/.test(cleaned)) {
                return `Ticket_HAM-${String(cleaned).padStart(3, '0')}`;
            }
            // Case-insensitive match for HAM pattern
            const match = cleaned.match(/HAM[-_]?(\d{1,3})/i);
            if (match) {
                return `Ticket_HAM-${String(match[1]).padStart(3, '0')}`;
            }
            return cleaned;
        }

        // Core Ticket Validation Logic
        function verifyAndMarkTicket(rawCode, source = 'Scan') {
            const ticketId = normalizeTicketCode(rawCode);
            const now = new Date();
            const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const dateISO = now.toISOString();

            let status = '';
            let title = '';
            let message = '';

            if (ticketsDB.hasOwnProperty(ticketId)) {
                const ticket = ticketsDB[ticketId];
                if (!ticket.used) {
                    // VALID UNUSED TICKET
                    ticket.used = true;
                    ticket.usedAt = dateISO;
                    saveDatabase();

                    status = 'SUCCESS';
                    title = 'ENTRY GRANTED';
                    message = 'Ticket is valid! Marked as USED.';
                    playSound('valid');
                    triggerVibration([100]);
                } else {
                    // ALREADY USED TICKET
                    const prevTime = new Date(ticket.usedAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                    status = 'ALREADY_USED';
                    title = 'INVALID / RE-ENTRY';
                    message = `Ticket was ALREADY USED at ${prevTime}. Access denied!`;
                    playSound('used');
                    triggerVibration([150, 50, 150]);
                }
            } else {
                // NOT IN DATABASE
                status = 'NOT_FOUND';
                title = 'INVALID TICKET';
                message = 'Barcode does not exist in HAM database.';
                playSound('invalid');
                triggerVibration([300]);
            }

            // Display Visual Feedback Box
            showResultBanner(status, title, ticketId, message, timeStr);

            // Append to Scan History
            scanHistory.unshift({
                ticketId: ticketId || rawCode,
                status: status,
                time: timeStr,
                source: source
            });

            // Limit history to last 50 items
            if (scanHistory.length > 50) scanHistory.pop();
            saveHistory();
        }

        // Render Status Result Box
        function showResultBanner(status, title, ticketId, message, timeStr) {
            const box = document.getElementById("statusResultBox");
            const iconBg = document.getElementById("statusIconBg");
            const icon = document.getElementById("statusIcon");
            const titleEl = document.getElementById("statusTitle");
            const ticketEl = document.getElementById("statusTicketId");
            const msgEl = document.getElementById("statusMessage");
            const timeEl = document.getElementById("statusTime");

            box.classList.remove("hidden", "bg-emerald-950/80", "border-emerald-500/50", "bg-rose-950/80", "border-rose-500/50", "bg-amber-950/80", "border-amber-500/50");
            iconBg.classList.remove("bg-emerald-500/20", "text-emerald-400", "bg-rose-500/20", "text-rose-400", "bg-amber-500/20", "text-amber-400");

            titleEl.textContent = title;
            ticketEl.textContent = ticketId;
            msgEl.textContent = message;
            timeEl.textContent = timeStr;

            if (status === 'SUCCESS') {
                box.classList.add("bg-emerald-950/80", "border-emerald-500/50");
                iconBg.classList.add("bg-emerald-500/20", "text-emerald-400");
                icon.className = "fa-solid fa-circle-check";
            } else if (status === 'ALREADY_USED') {
                box.classList.add("bg-amber-950/80", "border-amber-500/50");
                iconBg.classList.add("bg-amber-500/20", "text-amber-400");
                icon.className = "fa-solid fa-user-xmark";
            } else {
                box.classList.add("bg-rose-950/80", "border-rose-500/50");
                iconBg.classList.add("bg-rose-500/20", "text-rose-400");
                icon.className = "fa-solid fa-circle-xmark";
            }

            // Auto-scroll result into view on mobile
            box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        // Stats UI Update
        function updateStatsUI() {
            const total = Object.keys(ticketsDB).length;
            let usedCount = 0;
            for (let key in ticketsDB) {
                if (ticketsDB[key].used) usedCount++;
            }
            const validCount = total - usedCount;

            document.getElementById("statTotal").textContent = total;
            document.getElementById("statValid").textContent = validCount;
            document.getElementById("statUsed").textContent = usedCount;
        }

        // History UI Render
        function renderHistoryUI() {
            const historyList = document.getElementById("historyList");
            if (scanHistory.length === 0) {
                historyList.innerHTML = `<div class="text-center py-6 text-slate-500 text-xs">No scan records available yet.</div>`;
                return;
            }

            historyList.innerHTML = scanHistory.map(item => {
                let statusBadge = '';
                if (item.status === 'SUCCESS') {
                    statusBadge = `<span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-[10px] font-semibold px-2 py-0.5 rounded">VALID</span>`;
                } else if (item.status === 'ALREADY_USED') {
                    statusBadge = `<span class="bg-amber-500/10 text-amber-400 border border-amber-500/20 text-[10px] font-semibold px-2 py-0.5 rounded">USED</span>`;
                } else {
                    statusBadge = `<span class="bg-rose-500/10 text-rose-400 border border-rose-500/20 text-[10px] font-semibold px-2 py-0.5 rounded">INVALID</span>`;
                }

                return `
                    <div class="bg-slate-900/60 border border-slate-700/60 rounded-lg p-2.5 flex items-center justify-between text-xs">
                        <div class="flex items-center space-x-2.5 min-w-0">
                            <span class="text-slate-500 font-mono text-[10px] shrink-0">${item.time}</span>
                            <span class="font-mono font-medium text-slate-200 truncate">${item.ticketId}</span>
                        </div>
                        <div class="flex items-center space-x-2 shrink-0">
                            <span class="text-[10px] text-slate-500 uppercase">${item.source}</span>
                            ${statusBadge}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function clearHistoryLog() {
            scanHistory = [];
            saveHistory();
        }

        // Manual Input Handler
        function handleManualSubmit(e) {
            e.preventDefault();
            const inputEl = document.getElementById("manualInput");
            const value = inputEl.value;
            if (!value) return;
            
            verifyAndMarkTicket(value, 'Manual');
            inputEl.value = '';
        }

        // HTML5 QR Code Scanner Functions
        function onScanSuccess(decodedText) {
            const currentTime = new Date().getTime();
            // Prevent duplicate rapid scans of the same code within 2.5s
            if (decodedText === lastScannedCode && (currentTime - lastScanTime) < 2500) {
                return;
            }

            lastScannedCode = decodedText;
            lastScanTime = currentTime;

            verifyAndMarkTicket(decodedText, 'Camera');
        }

        function startScanner() {
            if (isScannerRunning) return;

            document.getElementById("scannerPlaceholder").classList.add("hidden");
            
            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }

            const config = {
                fps: 10,
                qrbox: { width: 250, height: 180 },
                aspectRatio: 1.0
            };

            html5QrCode.start(
                { facingMode: "environment" },
                config,
                onScanSuccess,
                (errorMessage) => {
                    // Silent parse failures during active scanning
                }
            ).then(() => {
                isScannerRunning = true;
                updateCameraControlsUI();
            }).catch((err) => {
                console.error("Camera access failed:", err);
                document.getElementById("scannerPlaceholder").classList.remove("hidden");
                alert("Unable to access camera. Please verify camera permissions or use manual entry.");
                isScannerRunning = false;
                updateCameraControlsUI();
            });
        }

        function stopScanner() {
            if (!html5QrCode || !isScannerRunning) return;

            html5QrCode.stop().then(() => {
                isScannerRunning = false;
                document.getElementById("scannerPlaceholder").classList.remove("hidden");
                updateCameraControlsUI();
            }).catch((err) => {
                console.error("Failed to stop camera:", err);
            });
        }

        function toggleScanner() {
            if (isScannerRunning) {
                stopScanner();
            } else {
                startScanner();
            }
        }

        function updateCameraControlsUI() {
            const btn = document.getElementById("toggleCameraBtn");
            const indicator = document.getElementById("scanModeIndicator");

            if (isScannerRunning) {
                btn.className = "flex-1 bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold py-2.5 px-3 rounded-lg flex items-center justify-center gap-2 transition shadow-md";
                btn.innerHTML = `<i class="fa-solid fa-video-slash"></i> <span>Stop Camera</span>`;
                indicator.className = "text-xs bg-emerald-500/10 text-emerald-400 px-2 py-0.5 rounded-full border border-emerald-500/20";
                indicator.textContent = "Scanning Active";
            } else {
                btn.className = "flex-1 bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold py-2.5 px-3 rounded-lg flex items-center justify-center gap-2 transition shadow-md";
                btn.innerHTML = `<i class="fa-solid fa-video"></i> <span>Start Camera</span>`;
                indicator.className = "text-xs bg-blue-500/10 text-blue-400 px-2 py-0.5 rounded-full border border-blue-500/20";
                indicator.textContent = "Ready";
            }
        }

        // Database Reset Modal Commands
        function confirmReset() {
            document.getElementById("resetModal").classList.remove("hidden");
        }

        function closeResetModal() {
            document.getElementById("resetModal").classList.add("hidden");
        }

        function executeReset() {
            localStorage.removeItem(STORAGE_KEY);
            localStorage.removeItem(HISTORY_KEY);
            ticketsDB = {};
            scanHistory = [];
            initDatabase();
            document.getElementById("statusResultBox").classList.add("hidden");
            closeResetModal();
        }

        // App Initialization
        window.addEventListener("DOMContentLoaded", () => {
            initDatabase();
            
            // Activate AudioContext on user touch/click
            document.body.addEventListener('click', () => {
                getAudioContext();
            }, { once: true });
        });
    </script>
</body>
</html>
